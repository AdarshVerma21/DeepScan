services:
  - type: web
    name: deepscan
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "7860"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: DEEPSCAN_MODEL_LIMIT
        value: "1"
      - key: DEEPSCAN_MODEL_SELECTION
        value: umm-maybe/AI-image-detector
      - key: DEEPSCAN_DISABLE_MODELS
        value: "1"
      - key: DEEPSCAN_ENABLE_DYNAMIC_INT8
        value: "1"
      - key: DEEPSCAN_TTA_ENABLED
        value: "0"
      - key: DEEPSCAN_TORCH_NUM_THREADS
        value: "2"
